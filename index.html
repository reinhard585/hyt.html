<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFB3D9">
<title>💕 a little question for you 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --pink-50: #FFF5F9;
    --pink-100: #FFE4ED;
    --pink-200: #FFCDDE;
    --pink-300: #FFB3D9;
    --pink-400: #FF8FB8;
    --pink-500: #FF6FA5;
    --pink-600: #E91E63;
    --pink-700: #C2185B;
    --gold: #FFD700;
    --cream: #FFFAFC;
    --shadow-pink: 0 20px 60px rgba(255, 105, 158, 0.25);
    --shadow-soft: 0 4px 15px rgba(255, 105, 158, 0.15);
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(135deg, #FFD9E8 0%, #FFE8F0 30%, #FFF5FA 60%, #FFE0EC 100%);
    position: relative;
    color: #5A2D4A;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255, 182, 213, 0.5) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255, 192, 220, 0.4) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(255, 224, 237, 0.4) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 10% 80%, rgba(255, 215, 0, 0.15) 0%, transparent 30%),
      radial-gradient(circle at 90% 10%, rgba(255, 143, 184, 0.2) 0%, transparent 30%);
    pointer-events: none;
    z-index: 0;
  }

  /* Floating background */
  .float-layer {
    position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1;
  }
  .floater {
    position: absolute;
    animation: floatUp linear infinite;
    user-select: none; will-change: transform;
  }
  @keyframes floatUp {
    0%   { transform: translateY(110vh) rotate(0deg)   scale(0.8); opacity: 0; }
    10%  { opacity: 0.65; }
    90%  { opacity: 0.65; }
    100% { transform: translateY(-10vh) rotate(360deg) scale(1.15); opacity: 0; }
  }

  /* Main container */
  .app {
    position: relative; z-index: 10;
    height: 100vh; width: 100vw;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }

  /* Screens */
  .screen {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    opacity: 0; transform: scale(0.85) translateY(20px);
    pointer-events: none;
    transition: opacity 0.6s ease, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .screen.active {
    opacity: 1; transform: scale(1) translateY(0); pointer-events: auto;
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 2px solid rgba(255, 179, 217, 0.4);
    border-radius: 36px;
    padding: 40px 32px;
    max-width: 460px; width: 100%;
    box-shadow: var(--shadow-pink);
    text-align: center;
    position: relative;
    overflow: visible;
  }

  .card::before {
    content: '';
    position: absolute; inset: -3px;
    border-radius: 36px;
    background: linear-gradient(135deg, rgba(255, 179, 217, 0.7), rgba(255, 143, 184, 0.4), rgba(255, 215, 0, 0.3));
    z-index: -1;
    filter: blur(18px);
    opacity: 0.7;
  }

  /* Hello Kitty character */
  .kitty-container {
    width: 180px; height: 180px;
    margin: 0 auto 20px;
    position: relative;
    animation: bob 3.5s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-12px) rotate(2deg); }
  }
  .kitty-svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 8px 20px rgba(255, 105, 158, 0.35));
  }
  .kitty-sparkles { position: absolute; inset: 0; pointer-events: none; }
  .kitty-sparkles .sp {
    position: absolute;
    animation: twinkle 1.8s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
    50%      { opacity: 1; transform: scale(1) rotate(180deg); }
  }

  /* Kitty blink */
  .eye { transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    94%, 98%      { transform: scaleY(0.1); }
  }

  /* Question screen */
  .question-text {
    font-family: 'Bubblegum Sans', cursive;
    font-size: 30px;
    color: #C2185B;
    margin-bottom: 6px;
    line-height: 1.25;
    text-shadow: 2px 2px 0 rgba(255, 179, 217, 0.5);
  }
  .sub-text {
    font-family: 'Quicksand', sans-serif;
    font-size: 15px;
    color: #B0708C;
    margin-bottom: 28px;
    font-weight: 500;
  }

  /* Buttons */
  .btn-row {
    display: flex; gap: 14px;
    justify-content: center;
    margin-top: 20px;
    min-height: 70px;
    align-items: center;
    position: relative;
  }
  .btn {
    font-family: 'Fredoka', sans-serif;
    font-size: 17px; font-weight: 600;
    padding: 16px 38px;
    border-radius: 50px;
    border: none; cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-transform: lowercase;
    letter-spacing: 0.5px;
    position: relative;
  }
  .btn-yes {
    background: linear-gradient(135deg, #FF6FA5, #E91E63);
    color: white;
    box-shadow: 0 8px 25px rgba(233, 30, 99, 0.45);
    z-index: 2;
    animation: pulseYes 2s ease-in-out infinite;
  }
  @keyframes pulseYes {
    0%, 100% { box-shadow: 0 8px 25px rgba(233, 30, 99, 0.45); }
    50%      { box-shadow: 0 8px 35px rgba(233, 30, 99, 0.7), 0 0 0 8px rgba(255, 111, 165, 0.2); }
  }
  .btn-yes:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 35px rgba(233, 30, 99, 0.6);
  }
  .btn-yes:active { transform: translateY(-1px) scale(1.02); }
  .btn-no {
    background: white;
    color: #B0708C;
    border: 2px solid #FFB3D9;
    box-shadow: 0 4px 15px rgba(255, 105, 158, 0.2);
  }
  .btn-no.dodging {
    position: absolute;
    z-index: 5;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Form screen */
  .yay-text {
    font-family: 'Bubblegum Sans', cursive;
    font-size: 40px;
    color: #E91E63;
    margin-bottom: 6px;
    text-shadow: 2px 2px 0 rgba(255, 179, 217, 0.5);
    animation: yayBounce 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes yayBounce {
    0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
    60%  { transform: scale(1.3) rotate(8deg);  opacity: 1; }
    100% { transform: scale(1)   rotate(0deg); }
  }

  .form-group { margin: 18px 0; text-align: left; }
  .form-label {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    color: #C2185B;
    font-size: 15px;
    margin-bottom: 8px;
    display: block;
    padding-left: 8px;
  }
  .form-input {
    width: 100%;
    padding: 14px 20px;
    border-radius: 25px;
    border: 2px solid #FFB3D9;
    background: rgba(255, 255, 255, 0.85);
    font-family: 'Quicksand', sans-serif;
    font-size: 15px;
    color: #5A2D4A;
    transition: all 0.3s ease;
    outline: none;
  }
  .form-input:focus {
    border-color: #FF6FA5;
    background: white;
    box-shadow: 0 0 0 5px rgba(255, 111, 165, 0.18);
  }
  .form-input::placeholder { color: #D4A0B8; font-style: italic; }

  .submit-btn {
    background: linear-gradient(135deg, #FF6FA5, #E91E63);
    color: white;
    font-family: 'Fredoka', sans-serif;
    font-size: 17px; font-weight: 600;
    padding: 14px 50px;
    border-radius: 50px;
    border: none; cursor: pointer;
    box-shadow: 0 8px 25px rgba(233, 30, 99, 0.45);
    margin-top: 15px;
    transition: all 0.3s ease;
  }
  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(233, 30, 99, 0.55);
  }

  /* Sending state */
  .submit-btn.sending {
    background: linear-gradient(135deg, #FFB3D9, #FF8FB8);
    cursor: wait;
    transform: none;
    box-shadow: 0 6px 18px rgba(255, 143, 184, 0.4);
    pointer-events: none;
    animation: sendingGlow 1.4s ease-in-out infinite;
  }
  @keyframes sendingGlow {
    0%, 100% { box-shadow: 0 6px 18px rgba(255, 143, 184, 0.4); }
    50%      { box-shadow: 0 6px 22px rgba(255, 143, 184, 0.7), 0 0 0 6px rgba(255, 179, 217, 0.3); }
  }
  .sending-dots {
    display: inline-flex;
    gap: 4px;
    margin-left: 8px;
    align-items: center;
    vertical-align: middle;
  }
  .sending-dots i {
    display: block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: white;
    animation: dotBounce 1.2s ease-in-out infinite;
  }
  .sending-dots i:nth-child(2) { animation-delay: 0.18s; }
  .sending-dots i:nth-child(3) { animation-delay: 0.36s; }
  @keyframes dotBounce {
    0%, 60%, 100% { transform: translateY(0);   opacity: 0.55; }
    30%           { transform: translateY(-7px); opacity: 1;    }
  }
  .sending-msg {
    margin-top: 14px;
    font-size: 13px;
    color: #C2185B;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 22px;
  }
  .sending-msg.show { opacity: 1; transform: translateY(0); }
  .sending-msg .plane {
    display: inline-block;
    animation: planeFly 1.4s ease-in-out infinite;
  }
  @keyframes planeFly {
    0%   { transform: translate(0, 0)    rotate(-12deg); }
    50%  { transform: translate(8px, -5px) rotate(18deg); }
    100% { transform: translate(0, 0)    rotate(-12deg); }
  }

  /* Result screen */
  .result-content { padding: 25px 0 10px; }
  .good-girl {
    font-family: 'Bubblegum Sans', cursive;
    font-size: 56px;
    color: #E91E63;
    text-shadow: 3px 3px 0 rgba(255, 179, 217, 0.6);
    margin-bottom: 18px;
    line-height: 1.05;
    animation: goodGirlBounce 1s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes goodGirlBounce {
    0%   { transform: scale(0) rotate(-180deg); opacity: 0; }
    50%  { transform: scale(1.25) rotate(10deg); }
    100% { transform: scale(1)    rotate(0deg);   opacity: 1; }
  }
  .kiss {
    font-size: 60px;
    animation: kiss 1.2s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes kiss {
    0%, 100% { transform: scale(1)    rotate(-6deg); }
    50%      { transform: scale(1.18) rotate(6deg); }
  }
  .proud-text {
    font-size: 17px;
    color: #C2185B;
    margin-bottom: 22px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 500;
  }
  .answer-display {
    background: rgba(255, 240, 246, 0.7);
    border-radius: 25px;
    padding: 20px;
    margin: 18px 0;
    border: 2px dashed #FFB3D9;
    text-align: left;
  }
  .answer-item {
    margin: 10px 0;
    font-size: 14px;
    color: #5A2D4A;
    line-height: 1.5;
  }
  .answer-item strong {
    color: #C2185B;
    font-family: 'Fredoka', sans-serif;
    display: block;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .answer-item span {
    font-weight: 500;
    word-break: break-word;
  }
  .footer-note {
    margin-top: 22px;
    font-size: 14px;
    color: #B0708C;
    font-style: italic;
  }
  .mega-heart {
    position: absolute;
    font-size: 38px;
    animation: megaFloat 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes megaFloat {
    0%, 100% { transform: translateY(0)    scale(1);   opacity: 0.75; }
    50%      { transform: translateY(-25px) scale(1.1); opacity: 1; }
  }

  /* Confetti */
  .confetti-layer {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
  }
  .confetti {
    position: absolute;
    width: 10px; height: 10px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-10vh) rotate(0deg);   opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* Patting scene (hand + kitty) on result screen */
  .petting-scene {
    position: relative;
    width: 220px;
    height: 220px;
    margin: 0 auto 14px;
  }
  .patting-hand {
    position: absolute;
    top: -6px;
    left: 50%;
    margin-left: -50px;
    width: 100px; height: 110px;
    animation: patRealistic 1.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    filter: drop-shadow(0 8px 18px rgba(255, 105, 158, 0.4));
    z-index: 5;
    transform-origin: center 80%;
  }
  @keyframes patRealistic {
    0%, 100% { transform: translateY(0)    rotate(-3deg) scale(1);     }
    25%      { transform: translateY(6px)  rotate(0deg)  scale(0.985); }
    45%      { transform: translateY(22px) rotate(4deg)  scale(0.94);  }  /* contact */
    55%      { transform: translateY(22px) rotate(4deg)  scale(0.94);  }  /* hold */
    75%      { transform: translateY(6px)  rotate(0deg)  scale(0.985); }
  }
  .patting-kitty {
    position: absolute;
    bottom: 0;
    left: 50%;
    margin-left: -80px;
    width: 160px; height: 160px;
    animation: headReact 1.2s ease-in-out infinite;
    filter: drop-shadow(0 8px 18px rgba(255, 105, 158, 0.3));
    transform-origin: center 75%;
  }
  @keyframes headReact {
    0%, 100% { transform: translateY(0)    scaleY(1)    scaleX(1);    }
    45%, 55% { transform: translateY(3px)  scaleY(0.95) scaleX(1.025); }  /* squish on pat */
  }
  /* Impact puffs at contact moment */
  .impact-puff {
    position: absolute;
    top: 30px;
    left: 50%;
    margin-left: -32px;
    width: 64px;
    height: 30px;
    pointer-events: none;
    z-index: 6;
  }
  .impact-puff span {
    position: absolute;
    font-size: 16px;
    opacity: 0;
    animation-duration: 1.2s;
    animation-iteration-count: infinite;
    animation-timing-function: ease-out;
  }
  .impact-puff .p1 { left: 4px;  top: 0;    animation-name: puffLeft;  }
  .impact-puff .p2 { right: 4px; top: 0;    animation-name: puffRight; }
  .impact-puff .p3 { left: 50%;  margin-left: -8px; top: -4px; animation-name: puffCenter; }
  @keyframes puffLeft {
    0%, 42%   { opacity: 0; transform: translate(0, 0)         scale(0.4); }
    50%       { opacity: 1; transform: translate(-2px, -2px)   scale(1);   }
    100%      { opacity: 0; transform: translate(-16px, -20px) scale(0.55);}
  }
  @keyframes puffRight {
    0%, 42%   { opacity: 0; transform: translate(0, 0)        scale(0.4); }
    50%       { opacity: 1; transform: translate(2px, -2px)   scale(1);   }
    100%      { opacity: 0; transform: translate(16px, -20px) scale(0.55);}
  }
  @keyframes puffCenter {
    0%, 42%   { opacity: 0; transform: translate(-50%, 0)     scale(0.4); }
    50%       { opacity: 1; transform: translate(-50%, -3px)  scale(1);   }
    100%      { opacity: 0; transform: translate(-50%, -22px) scale(0.55);}
  }
  .hearts-around {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .hearts-around span {
    position: absolute;
    font-size: 20px;
    animation: heartFloat 2.6s ease-in-out infinite;
    opacity: 0;
  }
  @keyframes heartFloat {
    0%   { transform: translateY(0)    scale(0.7); opacity: 0;   }
    30%  { opacity: 0.9; }
    50%  { transform: translateY(-22px) scale(1.1); opacity: 0.9; }
    100% { transform: translateY(-44px) scale(0.6); opacity: 0;   }
  }

  /* Mobile */
  @media (max-width: 480px) {
    .card        { padding: 30px 22px; border-radius: 28px; }
    .question-text { font-size: 23px; }
    .good-girl   { font-size: 42px; }
    .yay-text    { font-size: 34px; }
    .kitty-container { width: 150px; height: 150px; }
    .btn         { padding: 14px 30px; font-size: 16px; }
    .btn-row     { min-height: 60px; }
    .petting-scene { width: 190px; height: 200px; }
    .patting-hand  { width: 85px; height: 95px; margin-left: -42px; }
    .patting-kitty { width: 135px; height: 135px; margin-left: -67px; }
  }
  @media (max-width: 360px) {
    .question-text { font-size: 20px; }
    .good-girl   { font-size: 36px; }
  }
</style>
</head>
<body>

<div class="float-layer" id="floatLayer" aria-hidden="true"></div>

<div class="app">
  <!-- ===== Screen 1: The Question ===== -->
  <div class="screen active" id="screen-question">
    <div class="card">
      <div class="kitty-container">
        <svg class="kitty-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <radialGradient id="faceQ" cx="50%" cy="35%" r="65%">
              <stop offset="0%"   stop-color="#FFFFFF"/>
              <stop offset="100%" stop-color="#FAF0F5"/>
            </radialGradient>
            <linearGradient id="bowQ" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"   stop-color="#FF4081"/>
              <stop offset="50%"  stop-color="#E91E63"/>
              <stop offset="100%" stop-color="#AD1457"/>
            </linearGradient>
            <linearGradient id="earInnerQ" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%"   stop-color="#FFE0EC"/>
              <stop offset="100%" stop-color="#FFC1D9"/>
            </linearGradient>
            <radialGradient id="cheekQ" cx="50%" cy="50%" r="50%">
              <stop offset="0%"   stop-color="#FF8FB8" stop-opacity="0.7"/>
              <stop offset="100%" stop-color="#FF8FB8" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <!-- Ears -->
          <polygon points="40,70 55,25 90,60" fill="white" stroke="#E91E63" stroke-width="2.5" stroke-linejoin="round"/>
          <polygon points="110,60 145,25 160,70" fill="white" stroke="#E91E63" stroke-width="2.5" stroke-linejoin="round"/>
          <polygon points="55,38 73,42 80,62" fill="url(#earInnerQ)" opacity="0.85"/>
          <polygon points="127,42 145,38 142,62" fill="url(#earInnerQ)" opacity="0.85"/>

          <!-- Elegant bow with tails -->
          <g transform="translate(50, 36)">
            <path d="M 0,0 Q -12,-14 -22,-5 Q -25,4 -12,6 Q -4,4 0,0 Z" fill="url(#bowQ)" stroke="#AD1457" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M 0,0 Q 12,-14 22,-5 Q 25,4 12,6 Q 4,4 0,0 Z"   fill="url(#bowQ)" stroke="#AD1457" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M -2,4 L -10,20 L -3,18 L 0,8 Z"                 fill="url(#bowQ)" stroke="#AD1457" stroke-width="0.8" stroke-linejoin="round"/>
            <path d="M  2,4 L  10,20 L  3,18 L 0,8 Z"                 fill="url(#bowQ)" stroke="#AD1457" stroke-width="0.8" stroke-linejoin="round"/>
            <ellipse cx="0" cy="0" rx="5.5" ry="4.5" fill="url(#bowQ)" stroke="#AD1457" stroke-width="0.8"/>
            <ellipse cx="0" cy="0" rx="2"   ry="1.5" fill="#FFD700"/>
          </g>

          <!-- Face -->
          <ellipse cx="100" cy="115" rx="73" ry="66" fill="url(#faceQ)" stroke="#E91E63" stroke-width="2.5"/>
          <ellipse cx="100" cy="165" rx="50" ry="8" fill="#E91E63" opacity="0.05"/>

          <!-- Open eyes (whites + pupils + highlights) -->
          <ellipse class="eye" cx="75"  cy="108" rx="5" ry="8" fill="white" stroke="#2C2C2C" stroke-width="1.5"/>
          <ellipse class="eye" cx="125" cy="108" rx="5" ry="8" fill="white" stroke="#2C2C2C" stroke-width="1.5"/>
          <ellipse class="eye" cx="75"  cy="110" rx="3" ry="6" fill="#2C2C2C"/>
          <ellipse class="eye" cx="125" cy="110" rx="3" ry="6" fill="#2C2C2C"/>
          <circle cx="76.5"  cy="105" r="1.6" fill="white"/>
          <circle cx="126.5" cy="105" r="1.6" fill="white"/>

          <!-- Blushy cheeks -->
          <ellipse cx="55"  cy="132" rx="13" ry="7.5" fill="url(#cheekQ)"/>
          <ellipse cx="145" cy="132" rx="13" ry="7.5" fill="url(#cheekQ)"/>

<script>
  // ===== Floating background emojis =====
  (function makeFloaters(){
    const layer = document.getElementById('floatLayer');
    const emojis = ['💗','💖','💕','💓','💝','✨','⭐','🌸','🎀','💞'];
    for (let i = 0; i < 26; i++) {
      const el = document.createElement('span');
      el.className = 'floater';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = (Math.random() * 100) + '%';
      el.style.fontSize = (16 + Math.random() * 22) + 'px';
      el.style.animationDuration = (12 + Math.random() * 16) + 's';
      el.style.animationDelay = (Math.random() * 15) + 's';
      el.style.opacity = (0.3 + Math.random() * 0.4);
      layer.appendChild(el);
    }
  })();

  // ===== No-button dodge behavior =====
  const noBtn     = document.getElementById('noBtn');
  const yesBtn    = document.getElementById('yesBtn');
  const btnRow    = document.getElementById('btnRow');
  const noTexts   = ['no', 'really? 🥺', 'are you sure?', 'think again...', 'pretty please? 💕', 'last chance!', 'okay... :('];
  let dodgeCount  = 0;
  let noHidden    = false;

  function dodge(e){
    if (noHidden) return;
    if (e) { e.preventDefault(); e.stopPropagation(); }
    dodgeCount++;

    if (dodgeCount > 6) {
      noBtn.style.transition = 'all 0.5s ease';
      noBtn.style.transform  = 'scale(0)';
      noBtn.style.opacity    = '0';
      setTimeout(() => { noBtn.style.display = 'none'; }, 500);
      noHidden = true;
      return;
    }

    noBtn.classList.add('dodging');
    const rowRect  = btnRow.getBoundingClientRect();
    const btnRect  = noBtn.getBoundingClientRect();
    const maxX = Math.max(0, rowRect.width  - btnRect.width);
    const maxY = 90;
    const newX = Math.random() * maxX;
    const newY = (Math.random() - 0.5) * maxY;
    noBtn.style.left = newX + 'px';
    noBtn.style.top  = newY + 'px';
    noBtn.style.transform = `rotate(${(Math.random()-0.5)*30}deg) scale(${Math.max(0.7, 1 - dodgeCount*0.08)})`;

    if (noTexts[dodgeCount]) noBtn.textContent = noTexts[dodgeCount];

    const grow = 1 + Math.min(dodgeCount, 5) * 0.05;
    yesBtn.style.transform = `scale(${grow})`;
  }

  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('touchstart', dodge, { passive: false });
  noBtn.addEventListener('click', dodge);

  // ===== Screen navigation =====
  function goToScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    setTimeout(() => {
      const el = document.getElementById(id);
      if (el) el.classList.add('active');
    }, 60);
  }

  yesBtn.addEventListener('click', () => goToScreen('screen-form'));

  // ===== Form submit =====
  document.getElementById('planForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const when = document.getElementById('whenInput').value.trim();
    const how  = document.getElementById('howInput').value.trim();
    if (!when || !how) {
      const empty = !when ? document.getElementById('whenInput') : document.getElementById('howInput');
      empty.focus();
      empty.style.borderColor = '#E91E63';
      empty.style.boxShadow = '0 0 0 5px rgba(233, 30, 99, 0.2)';
      setTimeout(() => {
        empty.style.borderColor = '';
        empty.style.boxShadow = '';
      }, 1500);
      return;
    }

    // Show "sending..." state on the button + a small status line
    const submitBtn = document.getElementById('submitBtn');
    const sendMsg   = document.getElementById('sendingMsg');
    submitBtn.classList.add('sending');
    submitBtn.innerHTML = 'sending <span class="sending-dots"><i></i><i></i><i></i></span>';
    sendMsg.classList.add('show');

    // After 2 seconds, navigate to result screen with the petting kitty
    setTimeout(() => {
      document.getElementById('displayWhen').textContent = when;
      document.getElementById('displayHow').textContent  = how;
      sendMsg.classList.remove('show');
      goToScreen('screen-result');
      setTimeout(launchConfetti, 450);
    }, 2000);
  });

  // ===== Confetti =====
  function launchConfetti(){
    const layer  = document.getElementById('confettiLayer');
    const colors = ['#FF6FA5', '#FFB3D9', '#FFD700', '#E91E63', '#FF8FB8', '#FFFFFF', '#FFC1E3'];
    const shapes = ['50%', '0%', '50% 0 50% 0'];
    for (let i = 0; i < 90; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left   = (Math.random() * 100) + '%';
      c.style.top    = '-20px';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = (2.2 + Math.random() * 2.2) + 's';
      c.style.animationDelay    = (Math.random() * 1.6) + 's';
      const size = 6 + Math.random() * 9;
      c.style.width  = size + 'px';
      c.style.height = size + 'px';
      c.style.borderRadius = shapes[Math.floor(Math.random() * shapes.length)];
      c.style.transform = `rotate(${Math.random()*360}deg)`;
      layer.appendChild(c);
    }
    setTimeout(() => { layer.innerHTML = ''; }, 6000);
  }
</script>
